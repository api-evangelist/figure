aid: figure
name: Figure
description: >-
  Figure is a fintech lender and blockchain-native capital marketplace, backed by
  Ribbit Capital, and one of the largest non-bank HELOC (home equity line of credit)
  originators in the United States. Its Partner APIs let affiliates, brokers, and loan
  originators run the full HELOC lifecycle — pre-qualification, inquiry creation,
  borrower/SSN/income and property enrichment, lien verification, matching-property and
  offer selection, borrower costs, and document retrieval — plus a Portfolio Manager
  reporting API for asset holders to query and download owned and pledged loan-tape and
  payment-history data. The REST APIs authenticate with an apikey header behind a Kong
  gateway, support optional JWE/RSA payload encryption, expose separate test and
  production environments, and push webhooks as inquiries and applications progress.
